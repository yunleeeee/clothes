<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f3">
  <meta name="description" content="MORI 衣间，轻量化私人数字衣橱与辅助穿搭系统。">
  <title>MORI · 衣间</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/","@pixiv/three-vrm":"/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"}}</script>
  <script type="module" src="/src/app.js"></script>
</head>
<body>
  <div class="site">
    <header class="header">
      <div class="identity"><span class="logo">mori<span class="logo-period">.</span></span><span class="identity-line"></span><span class="identity-sub">衣间</span></div>
      <span class="header-caption">a wardrobe, just for you</span>
      <button id="add-garment" class="add-button" type="button"><span aria-hidden="true">＋</span> 添加衣服</button>
    </header>

    <div class="layout">
      <aside class="closet" aria-label="我的衣柜">
        <div class="closet-heading">
          <div><span class="eyebrow">YOUR COLLECTION</span><h1>我的衣柜 <span id="item-count" class="closet-count">00</span></h1></div>
        </div>
        <nav id="filters" class="filters" aria-label="衣物分类"></nav>
        <div id="wardrobe-grid" class="garment-grid" aria-live="polite"></div>
        <div id="wardrobe-empty" class="wardrobe-empty" hidden>还没有衣服。<br>点击右上角「添加衣服」开始。</div>
        <div class="closet-bottom">SELECT A PIECE TO STYLE <span>↗</span></div>
      </aside>

      <main class="showcase">
        <div class="showcase-top"><span>THE STYLING BOARD</span><span id="current-summary" class="showcase-index">00 PIECES</span></div>
        <div class="figure-wrap">
          <div class="figure-backdrop"></div>
          <div id="avatar" class="avatar" role="group" aria-label="今日穿搭平铺画布"></div>
          <div class="viewer-tools">
            <span id="viewer-mode" class="viewer-mode">LOOKBOOK</span>
            <select id="season-filter" class="viewer-select" aria-label="搭配季节">
              <option value="all">四季通用</option>
              <option value="summer">春夏轻薄</option>
              <option value="spring_autumn">春秋适中</option>
              <option value="winter">冬季保暖</option>
            </select>
            <button id="smart-style" class="viewer-button viewer-primary" type="button" title="保留已锁定单品，智能补全其余搭配">智能搭配</button>
            <button id="open-3d" class="viewer-button" type="button" aria-pressed="false">3D 试穿</button>
            <button id="toggle-guides" class="viewer-button" type="button" aria-pressed="true">比例线</button>
            <button id="save-look" class="viewer-button" type="button">收藏</button>
            <button id="clear-look" class="viewer-button" type="button">清空</button>
          </div>
          <div class="figure-caption">MORI <em>lookbook</em></div>
        </div>
        <section id="asset-controls" class="asset-controls" hidden aria-label="3D 人物设置">
          <div class="asset-toolbar">
            <span id="asset-status" class="asset-status" role="status">正在准备本地 VRM 人物…</span>
            <div class="asset-actions">
              <button id="rotate-3d" class="viewer-button" type="button" aria-pressed="false">自动旋转</button>
              <button id="reset-3d" class="viewer-button" type="button">视角复位</button>
            </div>
          </div>
          <div class="body-profile">
            <label><span>肩宽 <output id="profile-shoulders-value">100</output></span><input id="profile-shoulders" data-profile="shoulders" type="range" min="80" max="120" step="1" value="100"></label>
            <label><span>腰围 <output id="profile-waist-value">100</output></span><input id="profile-waist" data-profile="waist" type="range" min="80" max="120" step="1" value="100"></label>
            <label><span>胯宽 <output id="profile-hips-value">100</output></span><input id="profile-hips" data-profile="hips" type="range" min="80" max="120" step="1" value="100"></label>
            <label><span>腿长 <output id="profile-legs-value">100</output></span><input id="profile-legs" data-profile="legs" type="range" min="90" max="110" step="1" value="100"></label>
          </div>
        </section>
        <div class="showcase-bottom">
          <div id="harmony-bar" class="harmony-bar" aria-live="polite"></div>
        </div>
        <div id="saved-looks" class="saved-looks" hidden aria-label="已收藏穿搭"></div>
      </main>
    </div>
  </div>

  <dialog id="upload-dialog" class="upload-dialog">
    <form id="upload-form" class="upload-form">
      <div class="modal-head"><div><span class="eyebrow">NEW ITEM</span><h2>添加到衣柜</h2></div><button id="close-dialog" class="close-dialog" type="button" aria-label="关闭弹窗">×</button></div>
      <label class="image-pick">
        <input id="photo" type="file" name="photo" accept="image/jpeg,image/png,image/webp" required>
        <span id="upload-preview" class="upload-preview"><span class="upload-sign">＋</span><strong>选择一张衣服照片</strong><small>JPG、PNG、WebP · 最大 8 MB</small></span>
      </label>
      <div class="input-grid">
        <label class="field field-wide">衣服名称<input id="item-name" type="text" maxlength="45" placeholder="例如：白色衬衫" required></label>
        <label class="field">分类<select id="item-category">
          <option value="top">上衣</option><option value="bottom">下装</option><option value="dress">裙装</option>
          <option value="outer">外套</option><option value="shoes">鞋子</option><option value="accessory">配饰</option>
        </select></label>
        <label class="field">款式<select id="item-style" aria-label="衣服版型"></select></label>
        <label class="field">颜色<input id="item-color" type="color" value="#d4c6b9" aria-label="衣服主色"></label>
        <label class="field field-wide">适用季节<select id="item-season" aria-label="适用季节">
          <option value="all">四季通用</option><option value="summer">春夏轻薄</option>
          <option value="spring_autumn">春秋适中</option><option value="winter">冬季保暖</option>
        </select></label>
      </div>
      <div class="photo-source">
        <label><input type="radio" name="photoType" value="item" checked> 单品照</label>
        <label><input type="radio" name="photoType" value="worn"> 上身照</label>
        <label class="cutout-toggle"><input id="auto-cutout" type="checkbox" checked> 自动去背</label>
      </div>
      <p id="analysis-message" class="analysis-message" role="status">照片仅保存在本浏览器。单品照会自动去除纯色背景，直接用于平铺穿搭拼贴。</p>
      <div class="modal-actions">
        <button id="analyze-button" type="button" class="ai-button" disabled>AI 识别 <span>↗</span></button>
        <button type="submit" class="submit-button">加入衣柜 <span>→</span></button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
