<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f3">
  <meta name="description" content="MORI 衣间，一间私人的极简虚拟衣橱。">
  <title>MORI · 衣间</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/src/app.js"></script>
</head>
<body>
  <div class="site">
    <header class="header">
      <div class="identity"><span class="logo">mori<span class="logo-period">.</span></span><span class="identity-line"></span><span class="identity-sub">衣间</span></div>
      <span class="header-caption">a wardrobe, just for you</span>
      <button id="add-garment" class="add-button" type="button"><span aria-hidden="true">＋</span> 添加衣服</button>
    </header>

    <div class="layout">
      <aside class="closet" aria-label="我的衣柜">
        <div class="closet-heading">
          <div><span class="eyebrow">YOUR COLLECTION</span><h1>我的衣柜 <span id="item-count" class="closet-count">00</span></h1></div>
        </div>
        <nav id="filters" class="filters" aria-label="衣物分类"></nav>
        <div id="wardrobe-grid" class="garment-grid" aria-live="polite"></div>
        <div id="wardrobe-empty" class="wardrobe-empty" hidden>还没有衣服。<br>点击右上角「添加衣服」开始。</div>
        <div class="closet-bottom">SELECT A PIECE TO TRY ON <span>↗</span></div>
      </aside>

      <main class="showcase">
        <div class="showcase-top"><span>THE DRESSING ROOM</span><span class="showcase-index">01 — 01</span></div>
        <div class="figure-wrap">
          <div class="figure-backdrop"></div>
          <div id="avatar" class="avatar" role="img" aria-label="当前穿搭的二次元人物"></div>
          <div class="figure-caption">MORI <em>atelier</em></div>
        </div>
        <div class="showcase-bottom"><span>今日穿搭</span><span id="current-summary">点击左侧衣服试穿</span></div>
      </main>
    </div>
  </div>

  <dialog id="upload-dialog" class="upload-dialog">
    <form id="upload-form" class="upload-form">
      <div class="modal-head"><div><span class="eyebrow">NEW ITEM</span><h2>添加到衣柜</h2></div><button id="close-dialog" class="close-dialog" type="button" aria-label="关闭弹窗">×</button></div>
      <label class="image-pick">
        <input id="photo" type="file" name="photo" accept="image/jpeg,image/png,image/webp" required>
        <span id="upload-preview" class="upload-preview"><span class="upload-sign">＋</span><strong>选择一张衣服照片</strong><small>JPG、PNG、WebP · 最大 8 MB</small></span>
      </label>
      <div class="input-grid">
        <label class="field field-wide">衣服名称<input id="item-name" type="text" maxlength="45" placeholder="例如：白色衬衫" required></label>
        <label class="field">分类<select id="item-category">
          <option value="top">上衣</option><option value="bottom">下装</option><option value="dress">裙装</option>
          <option value="outer">外套</option><option value="shoes">鞋子</option><option value="accessory">配饰</option>
        </select></label>
        <label class="field">款式<select id="item-style" aria-label="衣服版型"></select></label>
        <label class="field">颜色<input id="item-color" type="color" value="#d4c6b9" aria-label="衣服在小人身上的颜色"></label>
      </div>
      <div class="photo-source"><label><input type="radio" name="photoType" value="item" checked> 单品照</label><label><input type="radio" name="photoType" value="worn"> 上身照</label></div>
      <p id="analysis-message" class="analysis-message" role="status">照片保存在本浏览器。小人采用简化插画效果。</p>
      <div class="modal-actions">
        <button id="analyze-button" type="button" class="ai-button" disabled>AI 识别 <span>↗</span></button>
        <button type="submit" class="submit-button">加入衣柜 <span>→</span></button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
